server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: PhongTro
  datasource:
    url: jdbc:mysql://localhost:3306/phongtro_db
    username: root
    password: Vinhdz2004@
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

jwt:
  signer-key: ""
  valid-duration: 3600 
  refreshable-duration: 86400 

logging:
  level:
    org.example.PhongTro: DEBUG
    org.hibernate.SQL: DEBUG
